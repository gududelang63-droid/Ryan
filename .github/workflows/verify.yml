name: Verify installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax, bootstrap integrity and safety tests
        run: |
          bash -n install.sh
          shellcheck install.sh
          python3 tests/check_bootstrap.py
          python3 -m unittest discover -s tests -v
      - name: Fetch and verify pinned upstream release
        run: |
          python3 - <<'PY'
          import setup
          from pathlib import Path
          Path('.test-release').mkdir()
          setup.download_archive('amd64', '.test-release/release.tar.gz')
          setup.download_acme('.test-release/acme.sh')
          setup.extract_archive('.test-release/release.tar.gz', '.test-release')
          PY
      - name: Real HTTPS panel integration
        env:
          XUI_TEST_APP: ${{ github.workspace }}/.test-release/x-ui
        run: python3 -m unittest discover -s tests -v
